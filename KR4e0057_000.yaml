body:
  text: 可傳集别集類五明提要臣等謹案可傳集一卷明袁華撰華有耕學齊詩集已著録此本為至正癸卯楊維楨所刪定華維楨弟子也前有維楨序稱吾鐵門稱能詩者南北凡百餘人求如張憲袁華者不能十人其集名亦維楨所題蓋推奬之甚至而維楨與李五舉論詩又稱梅一于酸鹽一于鹹食鹽梅而味常得鹹酸之外若華之作僅一于鹹酸而已其說自相剌謬今觀其詩大都典雅有法一掃元季穠纎之習而開明初春容之派維楨所論蓋標舉司空圖說以味外之味務為髙論耳其實一于酸鹹不猶愈于洪熙宣德以後所謂臺閣體者併無酸鹹之可味乎未可遽以是薄華也華耕學齊稿卷帙較富世多行之此集明史藝文志亦不著録千頃堂書目雖著録而不載卷數蓋黃虞稷亦未見之今以其為楊維楨所手定去取頗嚴故一取其備一取其精與全集並著于録焉乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀可傳集原序老杜曰新詩句句盡堪傳作詩不可傳曽不愈轅下曲雖千章萬什徒殄廢人楮筆耳君子曰不作無缺唐詩人凡百草有餘家其詩見於今可與杜老相傳者寧幾人哉豫徒張憲嘗以筆削唐百草家請於豫豫於各集選其可傳而無愧於君子議者什不能一二黃山谷甥四人皆善詩龜父者為最龜父詩所積凡二千餘首黃著為集其詩斤斤不百首谷因喜之以為句句可傳者在此吾鐵門稱能詩者南北凡百餘人求如張憲及吳下袁華輩者不能十人華自二十嵗後三十年所積亦無慮千有餘首而吾選之得如千首蓋又倍於龜父矣故命其集曰可傳好事者梓而行之求豫序故豫序之如此至正草二年嵗次癸卯春閏㑹稽楊維禎序
